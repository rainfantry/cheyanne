    <text x="14" y="58"  class="ascii"> ██╔════╝██║  ██║██╔════╝╚██╗ ██╔╝██╔══██╗████╗  ██║████╗  ██║██╔════╝</text>
    <text x="14" y="74"  class="ascii"> ██║     ███████║█████╗   ╚████╔╝ ███████║██╔██╗ ██║██╔██╗ ██║█████╗  </text>
    <text x="14" y="90"  class="ascii"> ██║     ██╔══██║██╔══╝    ╚██╔╝  ██╔══██║██║╚██╗██║██║╚██╗██║██╔══╝  </text>
    <text x="14" y="106" class="ascii"> ╚██████╗██║  ██║███████╗   ██║   ██║  ██║██║ ╚████║██║ ╚████║███████╗</text>
