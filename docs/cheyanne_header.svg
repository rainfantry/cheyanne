<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Courier New', Courier, monospace; font-size: 72px; font-weight: bold; fill: #ffffff; letter-spacing: 6px; }
      .glow  { animation: glow-pulse 3s ease-in-out infinite; }
      .sub   { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #93c5fd; letter-spacing: 3px; }
      .tag   { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #3b82f6; font-style: italic; }
      .stat  { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #94a3b8; }
      .dot   { fill: #22c55e; animation: blink 1.4s step-end infinite; }
      .line  { stroke: #1e293b; stroke-width: 1; }
      .border { stroke: #2563eb; stroke-width: 2; opacity: 0.3; }
      @keyframes glow-pulse {
        0%,100% { filter: drop-shadow(0 0 5px #2563eb) drop-shadow(0 0 15px #1d4ed8) drop-shadow(0 0 25px #1e3a8a); }
        50%     { filter: drop-shadow(0 0 15px #3b82f6) drop-shadow(0 0 30px #2563eb) drop-shadow(0 0 45px #1e40af); }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%     { opacity: 0.2; }
      }
    </style>
  </defs>

  <rect width="820" height="280" fill="#0d1117" rx="8"/>
  <line x1="0" y1="2" x2="820" y2="2" class="border"/>
  <line x1="0" y1="278" x2="820" y2="278" class="border"/>

  <g class="glow">
    <text x="410" y="105" text-anchor="middle" class="title">CHEYANNE</text>
  </g>

  <line x1="60" y1="130" x2="760" y2="130" class="line"/>

  <text x="410" y="158" text-anchor="middle" class="sub">WINDOWS SECURITY RESEARCH PROJECT</text>
  <text x="410" y="184" text-anchor="middle" class="tag">"Named after someone worth protecting. Built so defenders can see what attackers see."</text>

  <line x1="60" y1="202" x2="760" y2="202" class="line"/>

  <text x="410" y="228" text-anchor="middle" class="stat">MSRC VULN-195458 · CERT IV CYBER SECURITY · RESPONSIBLE DISCLOSURE</text>
  <text x="410" y="248" text-anchor="middle" class="stat">OWN HARDWARE · DEFENDER RTP ENABLED · DOCUMENTED FINDINGS ONLY</text>

  <circle cx="766" cy="228" r="4" class="dot"/>
</svg>
