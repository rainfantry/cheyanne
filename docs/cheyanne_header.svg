<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ascii { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #60a5fa; }
      .glow  { animation: glow-pulse 3s ease-in-out infinite; }
      .sub   { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #93c5fd; }
      .tag   { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #3b82f6; font-style: italic; }
      .stat  { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #94a3b8; }
      .dot   { fill: #22c55e; animation: blink 1.4s step-end infinite; }
      @keyframes glow-pulse {
        0%,100% { filter: drop-shadow(0 0 3px #2563eb) drop-shadow(0 0 7px #1d4ed8); }
        50%     { filter: drop-shadow(0 0 10px #3b82f6) drop-shadow(0 0 20px #2563eb) drop-shadow(0 0 30px #1e40af); }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%     { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="760" height="250" fill="#0d1117" rx="8"/>
  <line x1="0"   y1="2"   x2="760" y2="2"   stroke="#2563eb" stroke-width="2" opacity="0.3"/>
  <line x1="0"   y1="248" x2="760" y2="248" stroke="#2563eb" stroke-width="2" opacity="0.3"/>

